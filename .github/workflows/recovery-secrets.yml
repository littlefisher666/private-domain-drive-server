name: recovery-secrets
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump deploy credentials into artifact
        env:
          DEPLOY_ACCESS_KEY_ID: ${{ secrets.PDD_DEPLOY_ACCESS_KEY_ID }}
          DEPLOY_ACCESS_KEY_SECRET: ${{ secrets.PDD_DEPLOY_ACCESS_KEY_SECRET }}
          DEPLOY_ACCOUNT_ID: ${{ secrets.PDD_DEPLOY_ACCOUNT_ID }}
          FC_ROLE_ARN: ${{ secrets.PDD_FC_ROLE_ARN }}
        run: |
          mkdir -p recovery
          {
            echo "PDD_DEPLOY_ACCESS_KEY_ID=$DEPLOY_ACCESS_KEY_ID"
            echo "PDD_DEPLOY_ACCESS_KEY_SECRET=$DEPLOY_ACCESS_KEY_SECRET"
            echo "PDD_DEPLOY_ACCOUNT_ID=$DEPLOY_ACCOUNT_ID"
            echo "PDD_FC_ROLE_ARN=$FC_ROLE_ARN"
          } > recovery/server-deploy-secrets.env
          zip -q recovery/server-deploy-secrets.zip recovery/server-deploy-secrets.env
          rm recovery/server-deploy-secrets.env
      - uses: actions/upload-artifact@v4
        with:
          name: server-deploy-secrets
          path: recovery/server-deploy-secrets.zip
          retention-days: 1
