name: 发布阿里云函数计算服务

on:
  workflow_dispatch:

concurrency:
  group: fc-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

  deploy:
    name: 发布到阿里云函数计算
    needs: test
    if: >
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 部署凭证：用于 Serverless Devs 调用国内阿里云 FC API（RAM 用户 pdd-fc-deploy）
      PDD_DEPLOY_ACCESS_KEY_ID: ${{ secrets.PDD_DEPLOY_ACCESS_KEY_ID }}
      PDD_DEPLOY_ACCESS_KEY_SECRET: ${{ secrets.PDD_DEPLOY_ACCESS_KEY_SECRET }}
      PDD_DEPLOY_ACCOUNT_ID: ${{ secrets.PDD_DEPLOY_ACCOUNT_ID }}
      PDD_FC_ROLE_ARN: ${{ secrets.PDD_FC_ROLE_ARN }}
      # 运行时凭证：写入 FC 环境变量，供服务端直连 OSS 读写 config/users.json（RAM 用户 pdd-server）
      PDD_SERVER_OSS_ACCESS_KEY_ID: ${{ secrets.PDD_SERVER_OSS_ACCESS_KEY_ID }}
      PDD_SERVER_OSS_ACCESS_KEY_SECRET: ${{ secrets.PDD_SERVER_OSS_ACCESS_KEY_SECRET }}
      # 下发给客户端的 OSS 凭证（RAM 用户 pdd-client），登录时经 bootstrap 返回
      PDD_CLIENT_OSS_ACCESS_KEY_ID: ${{ secrets.PDD_CLIENT_OSS_ACCESS_KEY_ID }}
      PDD_CLIENT_OSS_ACCESS_KEY_SECRET: ${{ secrets.PDD_CLIENT_OSS_ACCESS_KEY_SECRET }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 校验必需密钥
        run: |
          required_vars=(
            PDD_DEPLOY_ACCESS_KEY_ID
            PDD_DEPLOY_ACCESS_KEY_SECRET
            PDD_DEPLOY_ACCOUNT_ID
            PDD_FC_ROLE_ARN
            PDD_SERVER_OSS_ACCESS_KEY_ID
            PDD_SERVER_OSS_ACCESS_KEY_SECRET
            PDD_CLIENT_OSS_ACCESS_KEY_ID
            PDD_CLIENT_OSS_ACCESS_KEY_SECRET
          )
          missing=0
          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret/env: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Please configure the secrets listed above in GitHub repository settings."
            exit 1
          fi

      - name: 安装生产依赖
        run: npm ci --omit=dev

      - name: 安装 Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: 配置 Serverless Devs 访问凭证
        run: |
          s config add \
            --AccessKeyID "$PDD_DEPLOY_ACCESS_KEY_ID" \
            --AccessKeySecret "$PDD_DEPLOY_ACCESS_KEY_SECRET" \
            --AccountID "$PDD_DEPLOY_ACCOUNT_ID" \
            --access default \
            -f

      - name: 部署到函数计算
        run: s deploy -y --use-local

      - name: 查看部署信息
        if: success()
        run: s info || true
