name: 发布阿里云函数计算服务

on:
  workflow_dispatch:

concurrency:
  group: fc-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

  deploy:
    name: 发布到阿里云函数计算
    needs: test
    if: >
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 部署凭证：用于 Serverless Devs 调用国内阿里云 FC API
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALIYUN_ACCOUNT_ID: ${{ secrets.ALIYUN_ACCOUNT_ID }}
      ALIYUN_FC_ROLE_ARN: ${{ secrets.ALIYUN_FC_ROLE_ARN }}
      # 运行时凭证：写入 FC 环境变量，供 STS AssumeRole 使用
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
      STS_ASSUME_ROLE_ARN: ${{ secrets.STS_ASSUME_ROLE_ARN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 校验必需密钥
        run: |
          required_vars=(
            ALIYUN_ACCESS_KEY_ID
            ALIYUN_ACCESS_KEY_SECRET
            ALIYUN_ACCOUNT_ID
            ALIYUN_FC_ROLE_ARN
            ALIBABA_CLOUD_ACCESS_KEY_ID
            ALIBABA_CLOUD_ACCESS_KEY_SECRET
            STS_ASSUME_ROLE_ARN
          )
          missing=0
          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret/env: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Please configure the secrets listed above in GitHub repository settings."
            exit 1
          fi

      - name: 安装生产依赖
        run: npm ci --omit=dev

      - name: 安装 Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: 配置 Serverless Devs 访问凭证
        run: |
          s config add \
            --AccessKeyID "$ALIYUN_ACCESS_KEY_ID" \
            --AccessKeySecret "$ALIYUN_ACCESS_KEY_SECRET" \
            --AccountID "$ALIYUN_ACCOUNT_ID" \
            --access default \
            -f

      - name: 部署到函数计算
        run: s deploy -y --use-local

      - name: 查看部署信息
        if: success()
        run: s info || true
