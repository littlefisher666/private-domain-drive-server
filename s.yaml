edition: 3.0.0
name: private-domain-drive-server
access: default

vars:
  region: cn-hangzhou
  functionName: private-domain-drive

resources:
  private-domain-drive:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: 私域网盘FC函数
      runtime: nodejs20
      handler: index.handler
      code: ./
      timeout: 10
      memorySize: 512
      diskSize: 512
      cpu: 0.35
      instanceConcurrency: 10
      internetAccess: true
      logConfig: auto
      role: ${env(ALIYUN_FC_ROLE_ARN)}
      environmentVariables:
        OSS_BUCKET: private-domain-drive
        OSS_REGION: cn-hangzhou
        OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
        OSS_ROOT_PREFIX: shared/
        TEXT_PREVIEW_MAX_BYTES: "524288"
        MULTIPART_UPLOAD_THRESHOLD_BYTES: "10485760"
        ALLOWED_PREVIEW_EXTENSIONS: jpg,jpeg,png,gif,pdf,txt,md
        STS_ROLE_SESSION_NAME: private-domain-drive-session
        STS_DURATION_SECONDS: "3600"
        STS_ENDPOINT: sts.cn-hangzhou.aliyuncs.com
        STS_ASSUME_ROLE_ARN: ${env(STS_ASSUME_ROLE_ARN)}
        ALIBABA_CLOUD_ACCESS_KEY_ID: ${env(ALIBABA_CLOUD_ACCESS_KEY_ID)}
        ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${env(ALIBABA_CLOUD_ACCESS_KEY_SECRET)}
