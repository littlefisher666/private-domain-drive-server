edition: 3.0.0
name: private-domain-drive-server
access: default

vars:
  region: cn-hangzhou
  functionName: private-domain-drive

resources:
  private-domain-drive:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: 私域网盘FC函数
      runtime: nodejs20
      handler: index.handler
      code: ./
      timeout: 10
      memorySize: 128
      diskSize: 512
      cpu: 0.05
      instanceConcurrency: 10
      internetAccess: true
      logConfig: auto
      role: ${env(PDD_FC_ROLE_ARN)}
      environmentVariables:
        PDD_SERVER_OSS_ACCESS_KEY_ID: ${env(PDD_SERVER_OSS_ACCESS_KEY_ID)}
        PDD_SERVER_OSS_ACCESS_KEY_SECRET: ${env(PDD_SERVER_OSS_ACCESS_KEY_SECRET)}
        PDD_CLIENT_OSS_ACCESS_KEY_ID: ${env(PDD_CLIENT_OSS_ACCESS_KEY_ID)}
        PDD_CLIENT_OSS_ACCESS_KEY_SECRET: ${env(PDD_CLIENT_OSS_ACCESS_KEY_SECRET)}
        PDD_OSS_BUCKET: private-domain-drive
        PDD_OSS_REGION: cn-hangzhou
        PDD_OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
        PDD_OSS_ROOT_PREFIX: shared/
        PDD_TEXT_PREVIEW_MAX_BYTES: "524288"
        PDD_MULTIPART_UPLOAD_THRESHOLD_BYTES: "10485760"
        PDD_ALLOWED_PREVIEW_EXTENSIONS: jpg,jpeg,png,gif,pdf,txt,md
